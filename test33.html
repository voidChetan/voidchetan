<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add / Edit Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #F5F7FA;
      color: #212121;
      font-family: "Segoe UI", sans-serif;
    }
    .navbar {
      background-color: #1976D2;
    }
    .navbar-brand {
      color: white !important;
      font-weight: 500;
    }
    .card {
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    .btn-primary {
      background-color: #1565C0;
      border: none;
    }
    .btn-primary:hover {
      background-color: #1976D2;
    }
    label {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="fees-student-list.html">
        <i class="fa fa-arrow-left"></i> Back to List
      </a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="card p-4">
      <h4 class="mb-4"><i class="fa fa-user-graduate"></i> Add / Edit Student</h4>

      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter student name">
          </div>
          <div class="col-md-6">
            <label class="form-label">Contact No</label>
            <input type="text" class="form-control" placeholder="Enter contact number">
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter email address">
          </div>
          <div class="col-md-6">
            <label class="form-label">City</label>
            <input type="text" class="form-control" placeholder="Enter city">
          </div>

          <div class="col-md-6">
            <label class="form-label">State</label>
            <input type="text" class="form-control" placeholder="Enter state">
          </div>
          <div class="col-md-6">
            <label class="form-label">Pincode</label>
            <input type="text" class="form-control" placeholder="Enter pincode">
          </div>

          <div class="col-md-6">
            <label class="form-label">Qualification</label>
            <input type="text" class="form-control" placeholder="Enter qualification">
          </div>
          <div class="col-md-6">
            <label class="form-label">College Name</label>
            <input type="text" class="form-control" placeholder="Enter college name">
          </div>

          <div class="col-md-6">
            <label class="form-label">College City</label>
            <input type="text" class="form-control" placeholder="Enter college city">
          </div>
          <div class="col-md-6">
            <label class="form-label">Aadhar Card</label>
            <input type="text" class="form-control" placeholder="Enter Aadhar number">
          </div>

          <div class="col-md-6">
            <label class="form-label">Reference By (ID)</label>
            <input type="number" class="form-control" placeholder="Enter reference ID">
          </div>
          <div class="col-md-6">
            <label class="form-label">Institute ID</label>
            <input type="number" class="form-control" placeholder="Enter institute ID">
          </div>

          <div class="col-12">
            <label class="form-label">Family Details</label>
            <textarea class="form-control" rows="2" placeholder="Enter family details"></textarea>
          </div>

          <div class="col-12 text-end mt-3">
            <button type="submit" class="btn btn-primary px-4">
              <i class="fa fa-save"></i> Save
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
