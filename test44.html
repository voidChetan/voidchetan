<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add / Edit Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #F5F7FA;
      color: #212121;
      font-family: "Segoe UI", sans-serif;
    }

    .navbar {
      background-color: #1976D2;
    }

    .navbar-brand {
      color: white !important;
      font-weight: 500;
    }

    .card {
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 10px;
    }

    .btn-primary {
      background-color: #1565C0;
      border: none;
    }

    .btn-primary:hover {
      background-color: #1976D2;
    }

    label {
      font-weight: 500;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1565C0;
      border-bottom: 2px solid #E3F2FD;
      margin-bottom: 0.75rem;
      padding-bottom: 0.25rem;
    }

    .form-control, textarea {
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="fees-student-list.html">
        <i class="fa fa-arrow-left"></i> Back to List
      </a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="card p-4">
      <h4 class="mb-4"><i class="fa fa-user-graduate"></i> Add / Edit Student</h4>

      <form>
        <!-- Personal Information -->
        <div class="section-title"><i class="fa fa-user"></i> Personal Details</div>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter full name">
          </div>
          <div class="col-md-4">
            <label class="form-label">Contact No</label>
            <input type="text" class="form-control" placeholder="Enter contact number">
          </div>
          <div class="col-md-4">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter email">
          </div>
        </div>

        <!-- Address Section -->
        <div class="section-title"><i class="fa fa-location-dot"></i> Address</div>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">City</label>
            <input type="text" class="form-control" placeholder="City">
          </div>
          <div class="col-md-4">
            <label class="form-label">State</label>
            <input type="text" class="form-control" placeholder="State">
          </div>
          <div class="col-md-4">
            <label class="form-label">Pincode</label>
            <input type="text" class="form-control" placeholder="Pincode">
          </div>
        </div>

        <!-- Education Section -->
        <div class="section-title"><i class="fa fa-school"></i> Education</div>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Qualification</label>
            <input type="text" class="form-control" placeholder="e.g. B.Sc, BCA">
          </div>
          <div class="col-md-4">
            <label class="form-label">College Name</label>
            <input type="text" class="form-control" placeholder="Enter college name">
          </div>
          <div class="col-md-4">
            <label class="form-label">College City</label>
            <input type="text" class="form-control" placeholder="Enter college city">
          </div>
        </div>

        <!-- Identification Section -->
        <div class="section-title"><i class="fa fa-id-card"></i> Identification</div>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Aadhar Card</label>
            <input type="text" class="form-control" placeholder="Enter Aadhar number">
          </div>
          <div class="col-md-4">
            <label class="form-label">Reference By (ID)</label>
            <input type="number" class="form-control" placeholder="Enter reference ID">
          </div>
          <div class="col-md-4">
            <label class="form-label">Institute ID</label>
            <input type="number" class="form-control" placeholder="Enter institute ID">
          </div>
        </div>

        <!-- Family Section -->
        <div class="section-title"><i class="fa fa-users"></i> Family Details</div>
        <div class="row g-3">
          <div class="col-md-8">
            <textarea class="form-control" rows="2" placeholder="Enter family details"></textarea>
          </div>
          <div class="col-md-4">
            <label class="form-label">Profile Photo</label>
            <input type="file" class="form-control">
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="text-end mt-4">
          <button type="reset" class="btn btn-outline-secondary me-2">
            <i class="fa fa-rotate-left"></i> Reset
          </button>
          <button type="submit" class="btn btn-primary px-4">
            <i class="fa fa-save"></i> Save
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
